<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridMethod - Reference Line Drawer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1 data-i18n="mainTitle">Reference Line Drawer</h1>
</header>

<main class="main-container">

    <!-- ===== LEFT COLUMN: Image & Format + Finalize ===== -->
    <section class="controls-column" aria-label="Image and Output Controls">

        <div class="form-group">
            <label for="languageSelect" data-i18n="langLabel">Language / Idioma</label>
            <select id="languageSelect" autocomplete="off" aria-label="Select Application Language">
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
        </div>

        <!-- Card 1: File & Format -->
        <article class="control-card">
            <h2 data-i18n="card1Title">1. Image &amp; Format</h2>
            <div class="form-group">
                <label for="upload" id="upload-label" class="button" data-i18n="selectImg">Select Image</label>
                <input type="file" id="upload" accept="image/*"/>
            </div>
            <div class="form-group">
                <label for="outputFormat" data-i18n="outputSize">Output Paper Size</label>
                <select id="outputFormat" autocomplete="off">
                    <option value="original" data-i18n="originalImage">Original Image</option>
                    <option value="A5">A5</option>
                    <option value="A4">A4</option>
                    <option value="A3">A3</option>
                    <option value="A2">A2</option>
                    <option value="A1">A1</option>
                </select>
            </div>
            <div class="form-group hidden" id="orientationContainer">
                <label data-i18n="orientation">Orientation</label>
                <div class="orientation-group" role="radiogroup" aria-label="Paper Orientation">
                    <input type="radio" id="orientationPortrait" name="orientation" value="portrait" checked>
                    <label for="orientationPortrait" data-i18n="portrait">Portrait</label>
                    <input type="radio" id="orientationLandscape" name="orientation" value="landscape">
                    <label for="orientationLandscape" data-i18n="landscape">Landscape</label>
                </div>
            </div>
            <div class="form-group hidden" id="fitModeContainer">
                <label data-i18n="fitLabel">Image Fitting</label>
                <div class="orientation-group" role="radiogroup" aria-label="Image Fitting Mode">
                    <input type="radio" id="fitModeFit" name="fitMode" value="fit">
                    <label for="fitModeFit" data-i18n="fitOption">Fit (Save Ink)</label>
                    <input type="radio" id="fitModeCover" name="fitMode" value="cover" checked>
                    <label for="fitModeCover" data-i18n="coverOption">Fill Paper (Cover)</label>
                </div>
            </div>
        </article>

        <!-- Card 4: Finalize -->
        <article class="control-card">
            <h2 data-i18n="card4Title">4. Finalize &amp; Download</h2>
            <button class="button" id="toggleGrayscale" data-i18n="grayscaleBtn">Convert to B&amp;W</button>
            <br>
            <a class="button hidden" id="downloadLink" download="modified-image.png" data-i18n="downloadBtn">Download Image</a>
        </article>

    </section>

    <!-- ===== CENTER COLUMN: Canvas & Info ===== -->
    <section class="canvas-column" aria-label="Canvas Display Area">
        <div id="imageDimensions" aria-live="polite">Upload an image to see its dimensions</div>
        <div id="panHint" class="hidden" data-i18n="panHint">Drag the image to reposition it</div>
        <canvas id="canvas" class="hidden" aria-label="Image preview with reference grid overlay"></canvas>
        <div id="zoomControls" class="hidden" aria-label="Zoom Controls">
            <button class="zoom-btn" id="zoomOut" disabled title="Zoom out" aria-label="Zoom out">−</button>
            <span id="zoomDisplay">1.0×</span>
            <button class="zoom-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
            <button class="zoom-btn" id="zoomReset" data-i18n-title="zoomResetTooltip" title="Reset zoom" aria-label="Reset zoom">↺</button>
            <span id="zoomMaxDisplay"></span>
        </div>
        <div id="scrollHint" class="hidden" data-i18n="scrollToZoom">Scroll to zoom · Drag to pan</div>
    </section>

    <!-- ===== RIGHT COLUMN: Reference Lines + Custom Grid + Clear ===== -->
    <section class="controls-column" aria-label="Grid and Reference Line Controls">

        <!-- Card 2: Line Overlays -->
        <article class="control-card">
            <h2 data-i18n="card2Title">2. Add Reference Lines</h2>
            <div class="form-group">
                <label for="lineColor" data-i18n="lineColor">Line Color</label>
                <input type="color" id="lineColor" value="#ff0000">
            </div>
            <label data-i18n="presets">Preset Diamonds &amp; Grids</label>
            <div class="grid-button-container">
                <input type="image" class="grid-button" src="img/diagonals.png" id="drawDiagonal" alt="Diagonals" title="Diagonals" data-i18n-title="diagTooltip"/>
                <input type="image" class="grid-button" src="img/diamond.png" id="drawDiamond1" alt="Diamond (2)" title="Diamond (2)"/>
                <input type="image" class="grid-button" src="img/diamond4.png" id="drawDiamond2" alt="Diamond (4)" title="Diamond (4)"/>
                <input type="image" class="grid-button" src="img/diamond8.png" id="drawDiamond3" alt="Diamond (8)" title="Diamond (8)"/>
                <input type="image" class="grid-button" src="img/diamond16.png" id="drawDiamond4" alt="Diamond (16)" title="Diamond (16)"/>
                <input type="image" class="grid-button" src="img/cross.png" id="drawCross" alt="Cross" title="Cross" data-i18n-title="crossTooltip"/>
                <input type="image" class="grid-button" src="img/grid4.png" id="drawGrid3" alt="Grid 4x4" title="Grid 4x4"/>
                <input type="image" class="grid-button" src="img/grid8.png" id="drawGrid7" alt="Grid 8x8" title="Grid 8x8"/>
                <input type="image" class="grid-button" src="img/grid16.png" id="drawGrid15" alt="Grid 16x16" title="Grid 16x16"/>
                <input type="image" class="grid-button" src="img/grid32.png" id="drawGrid31" alt="Grid 32x32" title="Grid 32x32"/>
            </div>
        </article>

        <!-- Card 3: Custom Grid -->
        <article class="control-card">
            <h2 data-i18n="card3Title">3. Add Custom Grid</h2>
            <div class="form-group">
                <label for="gridSpacing" data-i18n="gridLinesSpacing">Grid Spacing (cm)</label>
                <input type="number" id="gridSpacing" placeholder="e.g., 1" min="0.1" step="0.1" autocomplete="off">
            </div>
            <button class="button" id="applyGridButton" data-i18n="applyCustomGrid">Apply Custom Grid</button>
        </article>

        <!-- Clear button: only visible when grids are active -->
        <button class="button hidden" id="clearLines" data-i18n="clearBtn">Clear All Lines</button>

    </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
